name: Daily tithi WhatsApp

on:
  schedule:
    # GitHub often starts scheduled runs late (sometimes over an hour) or skips them, so each message
    # has several tries at quiet minutes; daily.js sends only once per day per message.
    - cron: '7 0 * * *'   # 5:37 AM India time: today's message (+ the coming week on Sundays)
    - cron: '37 0 * * *'  # 6:07 AM, backup
    - cron: '7 1 * * *'   # 6:37 AM, backup
    - cron: '37 13 * * *' # 7:07 PM India time: tomorrow's message, if tomorrow has something
    - cron: '7 14 * * *'  # 7:37 PM, backup
  workflow_dispatch: # lets you press "Run workflow" to test
    inputs:
      mode:
        description: 'morning (today), evening (tomorrow), or groups (list your WhatsApp group IDs)'
        default: morning
        type: choice
        options: [morning, evening, groups]

permissions:
  contents: write # only for the monthly keep-alive commit below

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send WhatsApp message
        run: node daily.js --mode=${{ github.event_name == 'workflow_dispatch' && inputs.mode || ((github.event.schedule == '37 13 * * *' || github.event.schedule == '7 14 * * *') && 'evening' || 'morning') }}
        env:
          WHATSAPP: ${{ secrets.WHATSAPP }}
      # GitHub pauses scheduled jobs in repos with no commits for 60 days; a tiny monthly commit prevents that
      - name: Keep the schedule alive
        if: github.event_name == 'schedule' && github.event.schedule == '7 0 * * *'
        run: |
          if [ "$(TZ=Asia/Kolkata date +%d)" = "01" ]; then
            date -u > .keepalive
            git config user.name "tithi-bot"
            git config user.email "tithi-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keep daily schedule active"
            git push
          fi
