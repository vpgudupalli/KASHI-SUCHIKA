name: Daily tithi WhatsApp

on:
  schedule:
    # Every evening, tomorrow's full message (Sunday evening also brings the coming week).
    # GitHub often starts scheduled runs late or skips them, so there are three tries at quiet
    # minutes; daily.js sends only once per evening.
    - cron: '37 13 * * *' # 7:07 PM India time
    - cron: '7 14 * * *'  # 7:37 PM, backup
    - cron: '37 14 * * *' # 8:07 PM, backup
  workflow_dispatch: # lets you press "Run workflow" to test
    inputs:
      mode:
        description: 'evening (tomorrow), morning (today), or groups (list your WhatsApp group IDs)'
        default: evening
        type: choice
        options: [evening, morning, groups]

permissions:
  contents: write # only for the monthly keep-alive commit below

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send WhatsApp message
        run: node daily.js --mode=${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'evening' }}
        env:
          WHATSAPP: ${{ secrets.WHATSAPP }}
      # GitHub pauses scheduled jobs in repos with no commits for 60 days; a tiny monthly commit prevents that
      - name: Keep the schedule alive
        if: github.event_name == 'schedule' && github.event.schedule == '37 13 * * *'
        run: |
          if [ "$(TZ=Asia/Kolkata date +%d)" = "01" ]; then
            date -u > .keepalive
            git config user.name "tithi-bot"
            git config user.email "tithi-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keep daily schedule active"
            git push
          fi
