name: Daily tithi WhatsApp

on:
  schedule:
    # Every morning, TOMORROW's full message (Sunday morning also brings the coming week).
    # GitHub often starts scheduled runs late or skips them, so there are three tries at quiet
    # minutes; daily.js sends only once per day.
    - cron: '32 2 * * *' # 8:02 AM India time
    - cron: '2 3 * * *'  # 8:32 AM, backup
    - cron: '32 3 * * *' # 9:02 AM, backup
  workflow_dispatch: # lets you press "Run workflow" to test
    inputs:
      mode:
        description: 'tomorrow (the daily message), today, test (send today now, even if already sent), or groups (list WhatsApp group IDs)'
        default: tomorrow
        type: choice
        options: [tomorrow, today, test, groups]

permissions:
  contents: write # only for the monthly keep-alive commit below

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send WhatsApp message
        run: node daily.js --mode=${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'tomorrow' }}
        env:
          WHATSAPP: ${{ secrets.WHATSAPP }}
      # GitHub pauses scheduled jobs in repos with no commits for 60 days; a tiny monthly commit prevents that
      - name: Keep the schedule alive
        if: github.event_name == 'schedule' && github.event.schedule == '32 2 * * *'
        run: |
          if [ "$(TZ=Asia/Kolkata date +%d)" = "01" ]; then
            date -u > .keepalive
            git config user.name "tithi-bot"
            git config user.email "tithi-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keep daily schedule active"
            git push
          fi
