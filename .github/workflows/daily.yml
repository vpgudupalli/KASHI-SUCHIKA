name: Daily tithi WhatsApp

on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM India time: today's message (+ the coming week on Sundays)
    - cron: '30 13 * * *' # 7:00 PM India time: tomorrow's message, if tomorrow has something
    # GitHub can start scheduled runs up to ~30 minutes late
  workflow_dispatch: # lets you press "Run workflow" to test
    inputs:
      mode:
        description: 'morning (today), evening (tomorrow), or groups (list your WhatsApp group IDs)'
        default: morning
        type: choice
        options: [morning, evening, groups]

permissions:
  contents: write # only for the monthly keep-alive commit below

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send WhatsApp message
        run: node daily.js --mode=${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '30 13 * * *' && 'evening' || 'morning') }}
        env:
          WHATSAPP: ${{ secrets.WHATSAPP }}
      # GitHub pauses scheduled jobs in repos with no commits for 60 days; a tiny monthly commit prevents that
      - name: Keep the schedule alive
        if: github.event_name == 'schedule' && github.event.schedule == '30 0 * * *'
        run: |
          if [ "$(TZ=Asia/Kolkata date +%d)" = "01" ]; then
            date -u > .keepalive
            git config user.name "tithi-bot"
            git config user.email "tithi-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keep daily schedule active"
            git push
          fi
